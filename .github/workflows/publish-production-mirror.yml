name: Publish production mirror

on:
  schedule:
    # Reconcile a missed push or a temporarily failed Pages deployment.
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - ES90 reservations 09:00 slot
      - ES90 reservations 12:00 slot
      - ES90 reservations 15:00 slot
      - ES90 reservations 18:00 slot
      - ES90 reservation watchdog
      - Nationwide EV subsidy watchdog
      - Update CDSID authorizations
      - Update 350kW charger data
      - Update ES90 reservations
      - Update Getcha competitor prices
      - Update nationwide EV subsidy data
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-mirror
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'volvo-digital-projects/es90-matrix' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out canonical repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure production deploy key
        env:
          PRODUCTION_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
        run: |
          test -n "$PRODUCTION_DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Publish canonical commit to existing Pages repository
        run: |
          git remote add production git@github.com:volvo-es90-matrix/es90-matrix.git
          git fetch production main
          if ! git merge-base --is-ancestor production/main HEAD; then
            echo "Production contains commits missing from canonical main; stopping to prevent data loss." >&2
            exit 1
          fi
          echo "PRODUCTION_BEFORE_SHA=$(git rev-parse production/main)" >> "$GITHUB_ENV"
          git push production HEAD:main

      - name: Verify production mirror commit
        run: |
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote production refs/heads/main | cut -f1)"
          if [ "$actual" != "$expected" ]; then
            git fetch production main
            if git merge-base --is-ancestor "$expected" production/main; then
              echo "A newer canonical commit has already reached production; its run will verify Pages."
              echo "SKIP_PUBLIC_VERIFY=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Production mirror SHA mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi

      - name: Verify public GitHub Pages files
        if: env.SKIP_PUBLIC_VERIFY != 'true'
        run: |
          python scripts/verify_production_pages.py \
            --base-sha "$PRODUCTION_BEFORE_SHA" \
            --commit "$(git rev-parse HEAD)"
