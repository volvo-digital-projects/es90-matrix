name: Nationwide EV subsidy watchdog

on:
  schedule:
    # Check after each required 08:00/11:00/14:00/17:00 Asia/Seoul slot.
    # If the primary attempt was missed, retry at :12/:32/:52 while stale.
    - cron: "12,32,52 23,2,5,8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/update-subsidy-data.yml
    with:
      check_required_slot: true
    secrets: inherit
