name: Update CDSID authorizations

on:
  schedule:
    # 06:00, 10:00, 14:00, 18:00 KST. Retry incomplete slots at +5/+10/+20/+40 minutes.
    - cron: "0,5,10,20,40 1,5,9,21 * * *"
    # Continue retrying incomplete slots every 30 minutes until the next slot.
    - cron: "0,30 0,2-4,6-8,10-20,22-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdsid-authorization-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check whether the latest CDSID slot is complete
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.update_slots import latest_slot, slot_needs_update

          slot = None
          should_run = True
          if os.environ.get("EVENT_NAME") == "schedule":
              slot = latest_slot()
              data = json.loads(Path("version.json").read_text(encoding="utf-8"))
              should_run = slot is not None and slot_needs_update(slot, data.get("cdsidCheckedAt"))

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"Collection slot: target={slot or 'manual'}, should_run={should_run}")
          PY

      - name: Install browser
        if: steps.slot.outputs.should_run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Reconcile the full Sales-DMS active roster
        if: steps.slot.outputs.should_run == 'true'
        id: cdsid
        env:
          VOLVO_SALES_ID: ${{ secrets.VOLVO_SALES_ID }}
          VOLVO_SALES_PASSWORD: ${{ secrets.VOLVO_SALES_PASSWORD }}
        run: python scripts/update_cdsid_authorizations.py

      - name: Publish CDSID authorization changes
        if: steps.slot.outputs.should_run == 'true'
        env:
          ACCESS_CHANGED: ${{ steps.cdsid.outputs.changed }}
          CHECKED_AT: ${{ steps.cdsid.outputs.checked_at }}
        run: |
          git config user.name "ES90 Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app.html
          if [ "$ACCESS_CHANGED" = "true" ]; then
            git commit -m "Auto update Sales-DMS login access"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Unable to publish CDSID access changes." >&2
                exit 1
              fi
              git pull --rebase -X theirs origin main
              sleep $((attempt * 2))
            done
          fi

          for attempt in 1 2 3 4 5; do
            git pull --ff-only origin main
            python scripts/update_version_metadata.py --cdsid-checked-at "$CHECKED_AT"
            git add version.json
            git commit -m "Record Sales-DMS access check"
            if git push; then
              exit 0
            fi
            # Regenerate this one field against the latest metadata on the next attempt.
            git reset --soft HEAD^
            git restore --staged --worktree -- version.json
            sleep $((attempt * 2))
          done

          echo "Unable to publish new CDSID hashes after 5 attempts." >&2
          exit 1
