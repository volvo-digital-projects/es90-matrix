name: Update ES90 reservations

on:
  schedule:
    # 06:00, 10:00, 14:00, 18:00 KST. Retry incomplete slots at +5/+10/+20/+40 minutes.
    - cron: "0,5,10,20,40 1,5,9,21 * * *"
    # Continue retrying incomplete slots every 30 minutes until the next slot.
    - cron: "0,30 0,2-4,6-8,10-20,22-23 * * *"
  workflow_call:
    inputs:
      target_hour:
        description: Target reservation slot in Asia/Seoul; 0 selects the latest slot.
        required: false
        type: number
        default: 0
      check_required_slot:
        description: Skip collection when the requested slot is already complete.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      check_required_slot:
        description: Skip collection when the latest slot is already complete.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: es90-reservation-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether the latest required slot is complete
        id: slot
        env:
          TARGET_HOUR: ${{ inputs.target_hour || 0 }}
          CHECK_REQUIRED_SLOT: ${{ github.event_name == 'schedule' || inputs.check_required_slot || false }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from scripts.update_slots import latest_slot, slot_needs_update, SEOUL, SLOT_HOURS

          slot = None
          should_run = True
          if os.environ.get("CHECK_REQUIRED_SLOT", "false").lower() == "true":
              slot = latest_slot()
              data = json.loads(Path("version.json").read_text(encoding="utf-8"))
              requested_hour = int(os.environ.get("TARGET_HOUR", "0"))
              if requested_hour in SLOT_HOURS:
                  now = datetime.now(SEOUL)
                  slot = now.replace(hour=requested_hour, minute=0, second=0, microsecond=0)
                  if now < slot:
                      slot = None
              should_run = slot is not None and slot_needs_update(slot, data.get("reservationUpdatedAt"))

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
              output.write(f"target_slot={slot.isoformat() if slot else 'manual'}\n")
          print(f"Collection slot: target={slot or 'manual'}, should_run={should_run}")
          PY

      - name: Install browser
        if: steps.slot.outputs.should_run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Read ES90 data from Daily Report
        if: steps.slot.outputs.should_run == 'true'
        env:
          VOLVO_SALES_ID: ${{ secrets.VOLVO_SALES_ID }}
          VOLVO_SALES_PASSWORD: ${{ secrets.VOLVO_SALES_PASSWORD }}
        run: python scripts/update_es90_reservations.py

      - name: Publish latest check
        if: steps.slot.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- app.html automation/es90-reservation-state.json; then
            echo "No ES90 data or check-time changes."
            exit 0
          fi

          RESERVATION_UPDATED_AT="$(
            python -c "import json; print(json.load(open('automation/es90-reservation-state.json', encoding='utf-8'))['observedAt'])"
          )"

          git config user.name "ES90 Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app.html automation/es90-reservation-state.json
          git commit -m "Auto update ES90 reservations"

          data_published=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              data_published=true
              break
            fi
            echo "Push raced with another update; rebasing (attempt ${attempt}/5)."
            git pull --rebase -X theirs origin main
            sleep $((attempt * 2))
          done
          if [ "$data_published" != "true" ]; then
            echo "Unable to publish ES90 reservation data after 5 attempts." >&2
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_version_metadata.py \
              --reservation-updated-at "$RESERVATION_UPDATED_AT"
            git add version.json
            git commit -m "Record ES90 reservation check time"
            if git push; then
              exit 0
            fi
            echo "Version metadata raced with another update (attempt ${attempt}/5)."
            sleep $((attempt * 2))
          done

          echo "Unable to publish ES90 reservation check time after 5 attempts." >&2
          exit 1
