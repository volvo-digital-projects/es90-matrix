name: Update Getcha competitor prices

on:
  schedule:
    # 06:00, 10:00, 14:00, 18:00 KST. Retry incomplete slots at +5/+10/+20/+40 minutes.
    - cron: "0,5,10,20,40 1,5,9,21 * * *"
    # Continue retrying incomplete slots every 30 minutes until the next slot.
    - cron: "0,30 0,2-4,6-8,10-20,22-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: getcha-competitor-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether the latest competitor price slot is complete
        id: daily
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.update_slots import latest_slot, slot_needs_update

          slot = None
          should_run = True
          if os.environ.get("EVENT_NAME") == "schedule":
              slot = latest_slot()
              data = json.loads(Path("version.json").read_text(encoding="utf-8"))
              state_path = Path("automation/getcha-price-state.json")
              state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
              has_unmatched_trims = state.get("unmatchedTrimCount", 0) > 0
              should_run = slot is not None and slot_needs_update(slot, data.get("competitorPriceCheckedAt"))
              should_run = should_run or has_unmatched_trims

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"Collection slot: target={slot or 'manual'}, should_run={should_run}")
          PY

      - name: Install browser
        if: steps.daily.outputs.should_run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Check exact Getcha trims, model years, and prices
        if: steps.daily.outputs.should_run == 'true'
        run: python scripts/update_getcha_prices.py

      - name: Publish competitor price check
        if: steps.daily.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- app.html automation/getcha-price-state.json; then
            echo "No Getcha date or price changes."
            exit 0
          fi

          COMPETITOR_PRICE_CHECKED_AT="$(
            python -c "import json; print(json.load(open('automation/getcha-price-state.json', encoding='utf-8'))['checkedAt'])"
          )"

          git config user.name "ES90 Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app.html automation/getcha-price-state.json
          git commit -m "Auto update Getcha competitor prices"

          data_published=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              data_published=true
              break
            fi
            echo "Push raced with another update; rebasing (attempt ${attempt}/5)."
            git pull --rebase -X theirs origin main
            sleep $((attempt * 2))
          done
          if [ "$data_published" != "true" ]; then
            echo "Unable to publish competitor prices after 5 attempts." >&2
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_version_metadata.py \
              --competitor-price-checked-at "$COMPETITOR_PRICE_CHECKED_AT"
            git add version.json
            git commit -m "Record competitor price check time"
            if git push; then
              exit 0
            fi
            echo "Version metadata raced with another update (attempt ${attempt}/5)."
            sleep $((attempt * 2))
          done

          echo "Unable to publish competitor price check time after 5 attempts." >&2
          exit 1
